function decodePage(name){
  const binary=atob(pageData[name]);
  const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  return new TextDecoder("utf-8").decode(bytes);
}

const iframe=document.getElementById("page");
const buttons=[...document.querySelectorAll(".nav-btn")];

function openPage(name){
  try {
    iframe.srcdoc=decodePage(name);
    document.title="waseemkhan902";
    buttons.forEach(b=>b.classList.toggle("active",b.dataset.page===name));
  } catch(e) {
    document.body.innerHTML="<pre style='padding:20px;color:red'>Page load error: "+e.message+"</pre>";
  }
}

buttons.forEach(btn=>{
  if(btn.dataset.page) btn.addEventListener("click",()=>openPage(btn.dataset.page));
});

document.getElementById("all-tools-btn").addEventListener("click",()=>{
  window.location.assign("https://waseempathan501.github.io/Waseem.Portfolio/");
});

document.getElementById("github-host-btn").addEventListener("click",()=>{
  window.location.assign("https://waseem-toolkits.netlify.app/");
});

openPage("My Portfolio");
</script>
